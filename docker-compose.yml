services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-restaurante_db}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD requerido}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD requerido}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?APP_ENCRYPTION_KEY requerido}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/postgres/00-init.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
      - ./database:/opt/requesty-sql:ro
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER:-postgres} -d ${DB_NAME:-restaurante_db}"]
      interval: 5s
      timeout: 3s
      retries: 10

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    user: "www-data:www-data"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-restaurante_db}
      DB_SCHEMA: ${DB_SCHEMA:-restaurante}
      DB_USER: ${DB_USER:-app_restaurante_rw}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD requerido}
      DB_SSL_MODE: ${DB_SSL_MODE:-prefer}
      DB_CONNECTION_TIMEOUT: ${DB_CONNECTION_TIMEOUT:-5}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?APP_ENCRYPTION_KEY requerido}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requerido}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-900}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS requerido}
      SESSION_SECURE: ${SESSION_SECURE:-true}
    volumes:
      - ./REQUESTY/PHP:/var/www/html:ro
      - php_storage:/var/www/html/storage
    networks:
      - backend_net

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - php
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./REQUESTY/PHP:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/login >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  backend_net:
    driver: bridge
    internal: false

volumes:
  pg_data:
  php_storage:
