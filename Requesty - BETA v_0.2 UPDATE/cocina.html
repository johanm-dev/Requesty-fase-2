<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Requesty - Cocina</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/cocina.css">
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <div class="sidebar-logo">Requesty</div>
            <nav class="sidebar-menu">
              <a class="sidebar-item" href="index.html">Inicio</a>
        <a class="sidebar-item" href="pedidos.html">Pedidos</a>
        <a class="sidebar-item active" href="cocina.html" aria-current="page">Cocina</a>
        <a class="sidebar-item" href="menu.html">Menú</a>
        <a class="sidebar-item" href="caja.html">Caja y facturación</a>
        <a class="sidebar-item" href="reportes.html">Reportes</a>
        <a class="sidebar-item" href="mesas.html">Mesas</a>
        <a class="sidebar-item" href="Pqrs.html">PQRS</a>
            </nav>
            <div class="sidebar-profile">
                <div class="profile-avatar">JP</div>
                <div class="profile-info">
                    <h4>Juan Pérez</h4>
                    <p>Administrador</p>
                </div>
            </div>
        </aside>

        <div class="main-content">
            <header class="top-bar">
                <div class="restaurant-name">Restaurante Aqui es</div>
            </header>

            <div class="content">
                <div class="page-header">
                    <h1 class="page-title">Cocina</h1>
                </div>

                <p id="mensaje-cocina" class="mensaje-cocina" role="alert" aria-live="assertive"></p>
                <p class="leyenda-alertas" aria-label="Alertas de tiempo">
                    <span class="leyenda-normal">Menos de 10 min</span>
                    <span class="leyenda-advertencia">10 min o más</span>
                    <span class="leyenda-critica">20 min o más</span>
                </p>
                <section class="resumen">
                    <div class="tarjeta-resumen pendiente">
                        <span class="numero-resumen" id="contador-pendientes">0</span>
                        <span class="texto-resumen">Pendientes</span>
                    </div>
                    <div class="tarjeta-resumen preparacion">
                        <span class="numero-resumen" id="contador-preparacion">0</span>
                        <span class="texto-resumen">En preparación</span>
                    </div>
                    <div class="tarjeta-resumen listo">
                        <span class="numero-resumen" id="contador-listos">0</span>
                        <span class="texto-resumen">Listos</span>
                    </div>
                </section>

                <div id="contenedor-pedidos" class="contenedor-pedidos" aria-live="polite"></div>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>protegerPagina("cocina");</script>
    <script src="js/inventario.js"></script>
    <script src="js/cocina.js"></script>
</body>
</html>
