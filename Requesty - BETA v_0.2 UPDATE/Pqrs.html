<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Requesty - PQRS</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/Pqrs.css">
</head>
<body>

<div class="container">

  <!-- ===================== SIDEBAR ===================== -->
  <aside class="sidebar">
    <div class="sidebar-logo">Requesty</div>

    <nav class="sidebar-menu">
        <a class="sidebar-item" href="index.html">Inicio</a>
        <a class="sidebar-item" href="pedidos.html">Pedidos</a>
        <a class="sidebar-item" href="cocina.html">Cocina</a>
        <a class="sidebar-item" href="menu.html">Menú</a>
        <a class="sidebar-item" href="caja.html">Caja y facturación</a>
        <a class="sidebar-item" href="reportes.html">Reportes</a>
        <a class="sidebar-item" href="mesas.html">Mesas</a>
        <a class="sidebar-item active" href="Pqrs.html" aria-current="page">PQRS</a>
    </nav>

    <div class="sidebar-profile">
      <div class="profile-avatar">A</div>
      <div class="profile-info">
        <h4>Administrador</h4>
        <p>Turno mañana</p>
      </div>
    </div>
  </aside>

  <!-- ===================== CONTENIDO PRINCIPAL ===================== -->
  <div class="main-content">

    <header class="top-bar">
      <span class="restaurant-name">Restaurante Aqui es</span>
    </header>

    <main class="content">

      <div class="page-header">
        <h1 class="page-title">PQRS</h1>
        <p class="page-subtitle">Peticiones, quejas, reclamos, sugerencias y felicitaciones registradas por los clientes.</p>
      </div>

      <!-- ===================== LAYOUT: Formulario Mejorado ===================== -->
      <div class="pqrs-layout">

        <section class="card form-card">
          <h2 class="card-title">Registrar PQRS</h2>

          <form id="form-pqrs" class="form-grid">

            <div class="form-group grid-full">
              <label for="tipo">Tipo de Solicitud</label>
              <select id="tipo" name="tipo" required>
                <option value="" disabled selected>Selecciona un tipo</option>
                <option value="Petición">Petición</option>
                <option value="Queja">Queja</option>
                <option value="Reclamo">Reclamo</option>
                <option value="Sugerencia">Sugerencia</option>
                <option value="Felicitación">Felicitación</option>
              </select>
            </div>

            <div class="form-group">
              <label for="id_cliente">Cliente</label>
              <select id="id_cliente" name="id_cliente" required>
                <option value="" disabled selected>Selecciona un cliente</option>
              </select>
            </div>

            <div class="form-group">
              <label for="id_pedido">Pedido relacionado <span class="opcional">(opcional)</span></label>
              <select id="id_pedido" name="id_pedido">
                <option value="">Ninguno</option>
              </select>
            </div>

            <div class="form-group grid-full">
              <label for="descripcion">Descripción</label>
              <textarea id="descripcion" name="descripcion" rows="4" placeholder="Cuéntanos qué pasó..." required></textarea>
            </div>

            <div class="form-actions grid-full">
              <button type="reset" class="btn btn-secondary">Limpiar</button>
              <button type="submit" class="btn btn-primary">Registrar PQRS</button>
            </div>

          </form>
        </section>

      </div>

    </main>
  </div>
</div>

<script src="js/auth.js"></script>
<script>protegerPagina("pqrs");</script>
<script src="js/pqrs.js"></script>
</body>
</html>
